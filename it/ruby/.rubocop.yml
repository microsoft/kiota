AllCops:
  TargetRubyVersion: 3.2

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Enabled: false

Style/RedundantReturn:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Naming/ClassAndModuleCamelCase:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Lint/EmptyFile:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Naming/ConstantName:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

# Don't raise an error if block is longer than 25 lines. This happens in "spec\defaultvalues\integration_test_defaultvalues.rb"
Metrics/BlockLength:
  Enabled: false

# Generated property names may contain letter_digit patterns (e.g. heading_1) from the OpenAPI spec
Naming/VariableNumber:
  Enabled: false

# Generated factory methods can have many discriminator branches
Metrics/CyclomaticComplexity:
  Enabled: false

# Composed type factories, serializers and deserializers branch once per union member,
# so their complexity tracks the arity of the union rather than any avoidable nesting
Metrics/PerceivedComplexity:
  Enabled: false

# Generated factory methods may just delegate to super
Lint/UselessMethodDefinition:
  Enabled: false

# one accessor per property, each with its own doc comment
Style/AccessorGrouping:
  EnforcedStyle: separated

# descriptions come from the API and may start with prose such as "Note:"
Style/CommentAnnotation:
  Enabled: false
