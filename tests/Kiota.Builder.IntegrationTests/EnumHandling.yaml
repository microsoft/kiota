openapi: 3.0.3
info:
  title: Test
  version: 3.0.x
  description: Testing enum handling.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
paths:
  "/play":
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MoveType"
          description: A move
      description: "Play a move"
  "/games/latest":
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Game"
              example:
                opening: rock-crushes
                moves:
                  - paper-wraps
                  - scissors-cut
                result: draw
          description: The latest game
      description: "Get the latest game"
components:
  schemas:
    MoveType:
      description: ""
      enum:
        - ROCK
        - PAPER
        - SCISSORS
      type: string
      example: ROCK
    Game:
      type: object
      properties:
        opening:
          "$ref": "#/components/schemas/MoveName"
        moves:
          type: array
          items:
            "$ref": "#/components/schemas/MoveName"
        result:
          type: string
          enum:
            - win
            - loss
            - draw
    MoveName:
      description: Wire values that are not valid identifiers
      type: string
      enum:
        - rock-crushes
        - paper-wraps
        - scissors-cut
