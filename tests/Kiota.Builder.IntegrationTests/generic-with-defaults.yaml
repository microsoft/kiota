openapi: 3.1.0
info:
  title: DynamicRef Generic Binding With Defaults API
  version: 0.1.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $defs:
                  itemType:
                    $dynamicAnchor: itemType
                    $ref: '#/components/schemas/User'
                $ref: '#/components/schemas/PaginatedTemplate'
        default:
          description: Error
components:
  schemas:
    User:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    PaginatedTemplate:
      $id: https://example.com/schemas/PaginatedTemplate
      $dynamicAnchor: itemType
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $dynamicRef: '#itemType'
        pageSize:
          type: integer
          default: 10
