openapi: 3.0.3
info:
  title: Kafka Instance API
  version: 0.13.0-SNAPSHOT
paths:
  /api/v1/topics:
    get:
      summary: Retrieves a list of topics
      operationId: getTopics
      responses:
        "423":
          description: Example.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/partitions:
    get:
      summary: Retrieves a list of partitions
      operationId: getPartitions
      responses:
        "500":
          description: Example.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
components:
  schemas:
    ServiceError:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ServiceErrorDetail"
    ServiceErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: brokerUnavailable
        message:
          type: string
          x-ms-primary-error-message: true
          example: The broker is not available.
    Error:
      allOf:
        - $ref: "#/components/schemas/ObjectReference"
        - description: General error response
          type: object
          properties:
            code:
              format: int32
              type: integer
              example: 123
    ObjectReference:
      type: object
      properties:
        id:
          description: Unique identifier.
          type: string
          example: my-sample-id
