openapi: 3.1.0
info:
  title: Property filtering validation
  version: 1.0.0
servers:
  - url: https://example.com
paths:
  /reference:
    get:
      responses:
        '200':
          description: A model with reference-owned declarations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceModel'
  /widgets:
    get:
      responses:
        '200':
          description: A polymorphic widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Widget'
      responses:
        '204':
          description: Accepted
components:
  schemas:
    ReferenceBase:
      type: object
      required: [inheritedName]
      properties:
        inheritedName:
          type: string
    ReferenceModel:
      $ref: '#/components/schemas/ReferenceBase'
      properties:
        localName:
          type: string
        localDrop:
          type: string
      allOf:
        - type: object
          properties:
            inlineName:
              type: string
            inlineDrop:
              type: string
        - type: object
          properties:
            secondName:
              type: string
            secondDrop:
              type: string
    Base:
      type: object
      required: [id]
      discriminator:
        propertyName: kind
        mapping:
          widget: '#/components/schemas/Widget'
      properties:
        id:
          type: string
        kind:
          type: string
        marker:
          type: string
        baseOptional:
          type: string
    Widget:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            name:
              type: string
            friends:
              type: array
              items:
                $ref: '#/components/schemas/Widget'
            choice:
              $ref: '#/components/schemas/Choice'
            drop:
              type: string
            profile:
              $ref: '#/components/schemas/Profile'
    Choice:
      anyOf:
        - $ref: '#/components/schemas/RequiredChoice'
        - $ref: '#/components/schemas/OptionalChoice'
    RequiredChoice:
      type: object
      required: [id]
      properties:
        id:
          type: string
        keep:
          type: string
    OptionalChoice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Profile:
      type: object
      properties:
        biography:
          type: string
