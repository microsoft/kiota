openapi: 3.0.3
info:
  title: Union without a discriminator
  version: 1.0.0
paths:
  /grants:
    post:
      description: Return a grant that is either pending or approved, without a discriminator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PendingGrant"
                  - $ref: "#/components/schemas/ApprovedGrant"
components:
  schemas:
    PendingGrant:
      type: object
      required:
        - interact
        - continue
      properties:
        interact:
          type: string
        continue:
          type: string
    ApprovedGrant:
      type: object
      required:
        - accessToken
        - continue
      properties:
        accessToken:
          type: string
        continue:
          type: string
