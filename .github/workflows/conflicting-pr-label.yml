# This is a basic workflow to help you get started with Actions

name: PullRequestConflicting

on:
  push:
    branches: [ main ]
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job for labeling pull requests with merge conflicts
  label-merge-conflicts:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: check merge conflicts
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        id: check
        with:
          dirtyLabel: "conflicting"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          continueOnMissingPermissions: true
          commentOnDirty: 'This pull request has conflicting changes, the author must resolve the conflicts before this pull request can be merged.'
          commentOnClean: 'Conflicts have been resolved. A maintainer will take a look shortly.'
      - name: remove previous merge conflict comments
        if: steps.check.outputs.prDirtyStatuses != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_DIRTY_STATUSES: ${{ steps.check.outputs.prDirtyStatuses }}
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const notificationBodies = new Set([
              'This pull request has conflicting changes, the author must resolve the conflicts before this pull request can be merged.',
              'Conflicts have been resolved. A maintainer will take a look shortly.',
            ]);
            const pullRequestNumbers = Object.keys(JSON.parse(process.env.PR_DIRTY_STATUSES));

            for (const issue_number of pullRequestNumbers) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });
              const previousComments = comments
                .filter(comment =>
                  comment.user?.login === 'github-actions[bot]' &&
                  notificationBodies.has(comment.body)
                )
                .sort((left, right) => right.id - left.id)
                .slice(1);

              for (const comment of previousComments) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
