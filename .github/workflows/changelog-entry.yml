name: Changelog entry

on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-changelog-entry:
    if: github.repository == 'microsoft/kiota' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check commit types
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $commitSubjects = @(gh api --paginate "repos/$env:BASE_REPOSITORY/pulls/$env:PR_NUMBER/commits" --jq '.[].commit.message | split("\n")[0]')
          $nonTestCiOrChoreCommits = @($commitSubjects | Where-Object { $_ -notmatch '^(test|ci|chore)(\([^)]+\))?!?:\s+\S' })
          $isTestsCiOrChoreOnly = $commitSubjects.Count -gt 0 -and $nonTestCiOrChoreCommits.Count -eq 0
          "is_tests_ci_or_chore_only=$($isTestsCiOrChoreOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Check for a new changelog entry
        id: changelog
        if: steps.commits.outputs.is_tests_ci_or_chore_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $addedFiles = @(gh api --paginate "repos/$env:BASE_REPOSITORY/pulls/$env:PR_NUMBER/files" --jq '.[] | select(.status == "added" and .additions > 0) | .filename')
          $hasEntry = ./scripts/check-changelog-entry.ps1 -addedFiles $addedFiles
          "has_entry=$($hasEntry.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Comment on missing changelog entry
        if: steps.commits.outputs.is_tests_ci_or_chore_only != 'true' && steps.changelog.outputs.has_entry == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          gh api --method POST "repos/$env:BASE_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            -f body='Thanks for opening this pull request! Please add a changelog entry so users can see what changed: a new Markdown file in `changelog.d/changed/` for a bug fix or a change in behavior, or in `changelog.d/added/` for a new feature, holding one line written for users. See [changelog.d/README.md](https://github.com/microsoft/kiota/blob/main/changelog.d/README.md) for an example.'
